name: Back-merge main to develop

on:
  push:
    branches: [main]

# Avoid concurrent back-merges stomping each other if multiple release PRs
# land in quick succession.
concurrency:
  group: back-merge-main-to-develop
  cancel-in-progress: false

jobs:
  back-merge:
    name: Merge main into develop
    runs-on: [self-hosted, macOS, ARM64, mac-studio-kneadit]
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          # Need full history so the merge has every commit available locally.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fast-forward check
        id: ff
        run: |
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "main is already in develop — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge main into develop
        if: steps.ff.outputs.skip == 'false'
        run: |
          git merge origin/main --no-ff -m "chore: back-merge main into develop (auto)"

      - name: Push develop
        if: steps.ff.outputs.skip == 'false'
        run: git push origin develop
