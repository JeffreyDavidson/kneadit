name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 9 * * 1' # Weekly on Monday at 9am UTC

concurrency:
  group: security-scan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ward:
    name: Ward Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install Ward
        run: go install github.com/eljakani/ward@latest

      # Generate baseline from the base branch so only NEW findings fail the build
      - name: Generate baseline from base branch
        if: github.event_name == 'pull_request'
        run: |
          git checkout ${{ github.event.pull_request.base.sha }}
          ward init
          ward scan . --update-baseline /tmp/ward-baseline.json || true
          git checkout ${{ github.sha }}

      - name: Initialize Ward
        run: ward init

      - name: Run security scan (PR)
        if: github.event_name == 'pull_request'
        run: ward scan . --fail-on high --baseline /tmp/ward-baseline.json

      - name: Run security scan (push/schedule)
        if: github.event_name != 'pull_request'
        run: ward scan . --fail-on critical
