name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 9 * * 1' # Weekly on Monday at 9am UTC
  workflow_dispatch:

concurrency:
  group: security-scan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  dependencies:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Setup PHP and Composer
        uses: ./.github/actions/setup-php-composer

      - name: Validate Composer configuration
        run: composer validate --strict --no-check-publish --no-interaction

      - name: Install Composer dependencies
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
        run: composer install --no-interaction --prefer-dist

      - name: Verify Composer platform requirements
        run: composer check-platform-reqs --no-dev --no-interaction

      - name: Verify PHP 8.5 compatibility
        run: composer why-not php 8.5 --locked --no-interaction

      - name: Resolve npm cache directory
        id: npm-cache
        shell: bash
        run: echo "directory=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Restore npm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.npm-cache.outputs.directory }}
          key: npm-${{ runner.os }}-node-24-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-node-24-

      - name: Install npm dependencies
        run: npm ci --ignore-scripts --no-fund

      - name: Audit Composer dependencies
        run: composer audit --locked --format=plain

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  ward:
    name: Ward Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'

      - name: Configure Ward environment
        run: |
          echo "GOPATH=$RUNNER_TEMP/ward-go" >> "$GITHUB_ENV"
          echo "HOME=$RUNNER_TEMP/ward-home" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/ward-go/bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/ward-home"

      - name: Install Ward
        run: go install github.com/eljakani/ward@v0.4.2

      - name: Generate baseline from base branch
        if: github.event_name == 'pull_request'
        run: |
          git checkout "${{ github.event.pull_request.base.sha }}"
          ward init
          ward scan . --output json --update-baseline "$RUNNER_TEMP/ward-baseline.json" || true
          git checkout "${{ github.sha }}"

      - name: Initialize Ward
        run: ward init

      - name: Generate baseline from previous revision
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if git rev-parse "${GITHUB_SHA}^" >/dev/null 2>&1; then
            git checkout "${GITHUB_SHA}^"
            ward init
            ward scan . --output json --update-baseline "$RUNNER_TEMP/ward-baseline.json" || true
            git checkout "$GITHUB_SHA"
          fi

      - name: Run security scan (PR)
        if: github.event_name == 'pull_request'
        run: |
          if [ -f "$RUNNER_TEMP/ward-baseline.json" ]; then
            ward scan . --output json,sarif --fail-on high --baseline "$RUNNER_TEMP/ward-baseline.json"
          else
            ward scan . --output json,sarif --fail-on high
          fi

      - name: Run security scan (push/schedule)
        if: github.event_name != 'pull_request'
        run: |
          if [ -f "$RUNNER_TEMP/ward-baseline.json" ]; then
            ward scan . --output json,sarif --fail-on high --baseline "$RUNNER_TEMP/ward-baseline.json"
          else
            ward scan . --output json,sarif --fail-on high
          fi

      - name: Normalize empty SARIF collections
        if: always() && hashFiles('ward-report.sarif') != ''
        run: |
          jq '(.runs[].tool.driver.rules //= []) | (.runs[].results //= [])' ward-report.sarif > "$RUNNER_TEMP/ward-report.sarif"
          mv "$RUNNER_TEMP/ward-report.sarif" ward-report.sarif

      - name: Upload Ward reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ward-security-reports
          path: |
            ward-report.json
            ward-report.sarif
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Ward SARIF
        if: always() && hashFiles('ward-report.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ward-report.sarif
