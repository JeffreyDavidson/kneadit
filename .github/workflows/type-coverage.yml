name: Type Coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

concurrency:
  group: type-coverage-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  type-coverage:
    name: Pest Type Coverage
    runs-on: [self-hosted, macOS, ARM64, mac-studio-kneadit]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Verify local PHP
        run: php -v && php -m

      - name: Install Composer
        run: |
          mkdir -p "$RUNNER_TEMP/composer-bin"
          curl -sS https://getcomposer.org/installer -o "$RUNNER_TEMP/composer-setup.php"
          php "$RUNNER_TEMP/composer-setup.php" --install-dir="$RUNNER_TEMP/composer-bin" --filename=composer
          echo "$RUNNER_TEMP/composer-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/composer-bin/composer" --version

      - name: Install Composer dependencies
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
        run: composer install --no-interaction --prefer-dist

      - name: Run Pest Type Coverage
        run: php -d memory_limit=1G vendor/bin/pest --type-coverage --min=100
