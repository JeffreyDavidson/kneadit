name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Build
    runs-on: [self-hosted, macOS, ARM64, mac-studio-kneadit]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify local PHP
        run: php -v && php -m

      - name: Install Composer
        run: |
          mkdir -p "$RUNNER_TEMP/composer-bin"
          curl -sS https://getcomposer.org/installer -o "$RUNNER_TEMP/composer-setup.php"
          php "$RUNNER_TEMP/composer-setup.php" --install-dir="$RUNNER_TEMP/composer-bin" --filename=composer
          echo "$RUNNER_TEMP/composer-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/composer-bin/composer" --version

      - name: Install Composer dependencies
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
        run: composer install --no-interaction --prefer-dist

      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build production assets
        run: npm run build

  tests:
    name: Pest
    runs-on: [self-hosted, macOS, ARM64, mac-studio-kneadit]

    steps:
      - uses: actions/checkout@v4

      - name: Verify local PHP
        run: php -v && php -m

      - name: Install Composer
        run: |
          mkdir -p "$RUNNER_TEMP/composer-bin"
          curl -sS https://getcomposer.org/installer -o "$RUNNER_TEMP/composer-setup.php"
          php "$RUNNER_TEMP/composer-setup.php" --install-dir="$RUNNER_TEMP/composer-bin" --filename=composer
          echo "$RUNNER_TEMP/composer-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/composer-bin/composer" --version

      - name: Copy environment file
        run: cp .env.example .env

      - name: Install Composer dependencies
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
        run: composer install --no-interaction --prefer-dist

      - name: Generate application key
        run: php artisan key:generate

      - name: Clear config cache
        run: php artisan config:clear

      - name: Run tests
        run: php artisan test --ci --compact --exclude-testsuite=Browser
