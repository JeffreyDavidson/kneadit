name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Setup PHP and Composer
        uses: ./.github/actions/setup-php-composer

      - name: Resolve npm cache directory
        id: npm-cache
        shell: bash
        run: echo "directory=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Restore npm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.npm-cache.outputs.directory }}
          key: npm-${{ runner.os }}-node-24-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-node-24-

      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Composer dependencies
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
        run: composer install --no-interaction --prefer-dist

      - name: Build production assets
        run: npm run build

  tests:
    name: Pest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP and Composer
        uses: ./.github/actions/setup-php-composer

      - name: Copy environment file
        run: cp .env.example .env

      - name: Install Composer dependencies
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
        run: composer install --no-interaction --prefer-dist

      - name: Generate application key
        run: php artisan key:generate

      - name: Clear config cache
        run: php artisan config:clear

      - name: Run tests
        run: php artisan test --ci --compact --exclude-testsuite=Browser --log-junit="$RUNNER_TEMP/pest-junit.xml"

      - name: Upload Pest timing report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: pest-junit
          path: ${{ runner.temp }}/pest-junit.xml
          if-no-files-found: ignore
          retention-days: 7

  tia:
    name: Pest Test Impact Analysis
    runs-on: ubuntu-latest
    # TIA can take substantially longer than the regular suite when PCOV builds
    # the dependency graph; keep it bounded while allowing the impacted run to finish.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Setup PHP and Composer with PCOV
        uses: ./.github/actions/setup-php-composer
        with:
          coverage: pcov

      - name: Resolve npm cache directory
        id: npm-cache
        shell: bash
        run: echo "directory=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Restore npm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.npm-cache.outputs.directory }}
          key: npm-${{ runner.os }}-node-24-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-node-24-

      - name: Copy environment file
        run: cp .env.example .env

      - name: Install Composer dependencies
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
        run: composer install --no-interaction --prefer-dist

      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate application key
        run: php artisan key:generate

      - name: Clear config cache
        run: php artisan config:clear

      - name: Restore latest main TIA baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          rm -rf "$RUNNER_TEMP/tia-artifact"
          mkdir -p "$RUNNER_TEMP/tia-artifact"
          run_id="$(gh run list --workflow=tia-baseline.yml --branch=main --status=success --limit=1 --json databaseId --jq '.[0].databaseId' 2>/dev/null)"
          if [[ -n "$run_id" ]]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name pest-tia-baseline --dir "$RUNNER_TEMP/tia-artifact" >/dev/null 2>&1
          fi
          exit 0

      - name: Install and validate TIA baseline
        id: tia-baseline
        env:
          HOME: ${{ runner.temp }}/pest-home
          PAO_DISABLE: 1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$HOME/.pest"
          baseline_path="$(vendor/bin/pest --baseline)"

          if [[ -z "$baseline_path" ]]; then
            echo 'valid=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          graph_path="$(find "$RUNNER_TEMP/tia-artifact" -type f -name graph.json -print -quit 2>/dev/null || true)"
          if [[ -z "$graph_path" ]]; then
            echo 'valid=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p "$baseline_path"
          cp -R "$(dirname "$graph_path")"/. "$baseline_path"/

          if ! php -r '$data = json_decode(file_get_contents($argv[1]), true); $baseline = is_array($data) ? ($data["baselines"]["main"] ?? null) : null; $valid = ($data["schema"] ?? null) === 1 && is_array($baseline) && is_string($baseline["sha"] ?? null) && $baseline["sha"] !== "" && is_array($baseline["tree"] ?? null) && count($baseline["tree"]) > 0 && is_array($baseline["results"] ?? null) && count($baseline["results"]) > 0; exit($valid ? 0 : 1);' "$baseline_path/graph.json"; then
            rm -rf "$baseline_path"
            echo 'valid=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'valid=true' >> "$GITHUB_OUTPUT"

      - name: Run impacted tests with full-suite fallback
        id: tia-tests
        if: steps.tia-baseline.outputs.valid == 'true'
        env:
          HOME: ${{ runner.temp }}/pest-home
        shell: bash
        run: |
          set +e
          vendor/bin/pest --tia --ci --compact --configuration=.github/phpunit-ci.xml --log-junit="$RUNNER_TEMP/tia-junit.xml"
          tia_status=$?
          set -e

          if [[ "$tia_status" -eq 0 ]]; then
            echo 'mode=impact-analysis' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo '::warning::Pest TIA was unavailable or its baseline was stale; running the full relevant suite.'
          echo 'mode=full-suite-fallback' >> "$GITHUB_OUTPUT"
          vendor/bin/pest --ci --compact --configuration=.github/phpunit-ci.xml --log-junit="$RUNNER_TEMP/tia-junit.xml"

      - name: Run full relevant suite fallback
        id: full-tests
        if: steps.tia-baseline.outputs.valid != 'true'
        run: |
          echo 'mode=full-suite-fallback' >> "$GITHUB_OUTPUT"
          vendor/bin/pest --ci --compact --configuration=.github/phpunit-ci.xml --log-junit="$RUNNER_TEMP/tia-junit.xml"

      - name: Summarize TIA execution
        if: ${{ always() && !cancelled() }}
        env:
          BASELINE_VALID: ${{ steps.tia-baseline.outputs.valid }}
          TIA_MODE: ${{ steps.tia-tests.outputs.mode }}
          FULL_MODE: ${{ steps.full-tests.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          mode="${TIA_MODE:-${FULL_MODE:-unknown}}"
          test_count='unavailable'

          if [[ -s "$RUNNER_TEMP/tia-junit.xml" ]]; then
            parsed_count="$(php -r '$xml = simplexml_load_file($argv[1]); if ($xml === false) { exit(1); } $tests = (string) $xml["tests"]; if ($tests === "") { $count = 0; foreach ($xml->testsuite as $suite) { $count += (int) $suite["tests"]; } $tests = (string) $count; } echo $tests;' "$RUNNER_TEMP/tia-junit.xml" 2>/dev/null || true)"

            if [[ -n "$parsed_count" ]]; then
              test_count="$parsed_count"
            fi
          fi

          printf '%s\n' \
            '### Pest Test Impact Analysis' \
            "- Baseline valid: ${BASELINE_VALID:-false}" \
            "- Execution mode: $mode" \
            "- Tests executed: $test_count" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload TIA timing report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: pest-tia-junit
          path: ${{ runner.temp }}/tia-junit.xml
          if-no-files-found: ignore
          retention-days: 7
