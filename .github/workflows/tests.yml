name: Tests

on:
  workflow_dispatch:
  # develop pushes catch breakage between PRs that each passed against an older develop.
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Setup PHP and Composer
        uses: ./.github/actions/setup-php-composer

      - name: Resolve npm cache directory
        id: npm-cache
        shell: bash
        run: echo "directory=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Restore npm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.npm-cache.outputs.directory }}
          key: npm-${{ runner.os }}-node-24-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-node-24-

      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Composer dependencies
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
        run: composer install --no-interaction --prefer-dist

      - name: Build production assets
        run: npm run build

  tests:
    name: Pest
    # Test impact analysis is not run in CI: this parallel full-suite job is faster. The
    # tia-baseline workflow still publishes a baseline that local `pest --tia` runs download.
    runs-on: ubuntu-latest
    # The suite runs in parallel (about 5 to 7 minutes on a 4 vCPU runner). The serial run
    # took 16 to 20 minutes and kept hitting the old 20 minute limit.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP and Composer
        uses: ./.github/actions/setup-php-composer

      - name: Copy environment file
        run: cp .env.example .env

      - name: Install Composer dependencies
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
        run: composer install --no-interaction --prefer-dist

      - name: Generate application key
        run: php artisan key:generate

      - name: Clear config cache
        run: php artisan config:clear

      - name: Run tests
        run: |
          echo "Runner CPUs: $(nproc)"
          vendor/bin/pest --parallel --processes=4 --ci --compact --exclude-testsuite=Browser --log-junit="$RUNNER_TEMP/pest-junit.xml"

      - name: Upload Pest timing report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: pest-junit
          path: ${{ runner.temp }}/pest-junit.xml
          if-no-files-found: ignore
          retention-days: 7
