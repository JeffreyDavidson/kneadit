name: Setup PHP and Composer
description: Configure the hosted PHP runtime and cache Composer downloads.

inputs:
    php-version:
        description: PHP version to use.
        required: false
        default: '8.5'
    coverage:
        description: Coverage driver to install. Use pcov only for coverage or TIA jobs.
        required: false
        default: none
    extensions:
        description: PHP extensions required by KneadIt.
        required: false
        default: bcmath,curl,dom,fileinfo,gd,intl,mbstring,pcntl,pdo_sqlite,sockets,xml,zip

runs:
    using: composite
    steps:
        - name: Setup PHP and Composer
          uses: shivammathur/setup-php@v2
          with:
              php-version: ${{ inputs.php-version }}
              extensions: ${{ inputs.extensions }}
              coverage: ${{ inputs.coverage }}
              tools: composer:2
              ini-values: memory_limit=4G

        - name: Verify PHP and Composer
          shell: bash
          run: |
              php --version
              composer --version

        - name: Resolve Composer cache directory
          id: composer-cache
          shell: bash
          run: echo "directory=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

        - name: Restore Composer download cache
          uses: actions/cache@v6
          with:
              path: ${{ steps.composer-cache.outputs.directory }}
              key: composer-${{ runner.os }}-php-${{ inputs.php-version }}-composer-2-${{ hashFiles('composer.lock') }}
              restore-keys: |
                  composer-${{ runner.os }}-php-${{ inputs.php-version }}-composer-2-
